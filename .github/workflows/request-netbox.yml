
name: Read TOML and query NetBox

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Ruta del TOML dentro de requests/"
        required: true
        type: string
        default: "requests/vm-dev-01.toml"

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5

    env:
      NETBOX_URL: ${{ vars.NETBOX_URL || 'http://localhost:8000' }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      NETBOX_AUTH_SCHEME: ${{ vars.NETBOX_AUTH_SCHEME || 'Bearer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query NetBox and create clean JSON
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail

          python3 scripts/validate_request.py "$REQUEST_PATH" | tee netbox-output.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path("netbox-output.txt").read_text(encoding="utf-8")
          start = output.find('{\n  "request_id"')

          if start == -1:
              raise SystemExit("No se encontró el objeto JSON en la salida de NetBox")

          data = json.loads(output[start:])
          Path("netbox-result.json").write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("JSON generado:")
          print(json.dumps(data, indent=2, ensure_ascii=False))
  
      - name: Verify NetBox JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool netbox-result.json

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test init -backend=false

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test plan \
            -var-file=../../netbox-result.json \
            -out=tfplan

          echo "## Resultado Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=terraform/local-test show -no-color tfplan \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"