

name: Read TOML and query NetBox

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Ruta del TOML dentro de requests/"
        required: true
        type: string
        default: "requests/vm-dev-01.toml"

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10

    env:
      NETBOX_URL: ${{ vars.NETBOX_URL || 'http://localhost:8000' }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      NETBOX_AUTH_SCHEME: ${{ vars.NETBOX_AUTH_SCHEME || 'Bearer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request and query NetBox
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail

          echo "Archivo recibido: $REQUEST_PATH"
          test -f "$REQUEST_PATH"
          cat "$REQUEST_PATH"

          echo "Validando solicitud y consultando NetBox..."
          python3 scripts/validate_request.py "$REQUEST_PATH"

          echo "Verificando JSON generado..."
          test -f netbox-result.json
          python3 -m json.tool netbox-result.json

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test init -backend=false

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test plan \
            -var-file=../../netbox-result.json \
            -out=tfplan

          echo "## Resultado Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=terraform/local-test show -no-color tfplan \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test apply \
            -var-file=../../netbox-result.json \

          echo "## Resultado Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=terraform/local-test show -no-color tfplan \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"