
name: Read TOML and query NetBox

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Ruta del TOML dentro de requests/"
        required: true
        type: string
        default: "requests/vm-dev-01.toml"

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5

    env:
      NETBOX_URL: ${{ vars.NETBOX_URL || 'http://localhost:8000' }}
      NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
      NETBOX_AUTH_SCHEME: ${{ vars.NETBOX_AUTH_SCHEME || 'Bearer' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate TOML and query NetBox
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/validate_request.py "$REQUEST_PATH" | tee netbox-result.json
          cat netbox-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Debug NetBox result
        shell: bash
        run: |
          set -eu
          echo "Directorio actual:"
          pwd

          echo "Archivos JSON encontrados:"
          find . -name "netbox-result.json" -type f -print

          echo "Contenido del archivo esperado:"
          if [ -f netbox-result.json ]; then
            ls -l netbox-result.json
            wc -c netbox-result.json
            cat -A netbox-result.json
          else
            echo "No existe netbox-result.json en la raíz del repositorio"
            exit 1
          fi

      - name: Verify NetBox JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool netbox-result.json

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test init -backend=false

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/local-test plan \
            -var-file=../../netbox-result.json \
            -out=tfplan

          echo "## Resultado Terraform" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=terraform/local-test show -no-color tfplan \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"